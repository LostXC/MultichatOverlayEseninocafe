<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Download Bit Icons (outlined, static) as SVG</title>
<style>
	body { font-family: system-ui, sans-serif; background:#18181b; color:#efeff1; margin:0; padding:24px; }
	h1 { font-size:18px; margin:0 0 4px; }
	p  { color:#adadb8; margin:0 0 20px; font-size:13px; }
	button { background:#9147ff; color:#fff; border:0; border-radius:6px; padding:10px 16px; font-size:14px; cursor:pointer; }
	button:hover { background:#772ce8; }
	.grid { display:flex; gap:16px; flex-wrap:wrap; margin-top:24px; }
	.card { background:#0e0e10; border:1px solid #2a2a2d; border-radius:8px; padding:14px; text-align:center; width:130px; }
	.card img { height:56px; }
	.card .name { font-size:12px; margin-top:8px; color:#adadb8; }
	.card a { display:inline-block; margin-top:8px; font-size:12px; color:#a970ff; }
</style>
</head>
<body>
	<h1>Twitch Bit Icons → outlined static SVG</h1>
	<p>Same tiers &amp; outline as the overlay. Click to generate; each card has its own download link, or grab them all at once.</p>
	<button id="all">Download all 5</button>
	<div class="grid" id="grid"></div>

<script>
// Twitch tiers + matching outline colors, mirrored from script.js
const BITS = [
	{ name: 'gray',   outline: '#3a3a3a' },
	{ name: 'purple', outline: '#5e1a9e' },
	{ name: 'green',  outline: '#005000' },
	{ name: 'blue',   outline: '#1a3a7a' },
	{ name: 'red',    outline: '#7a0000' },
];
const OUTLINE_PX = 5;
const url = name => `https://static-cdn.jtvnw.net/bits/dark/static/${name}/2`;

// Reproduces makeOutlinedIcon() from script.js, but returns the canvas
// so we can wrap the outlined raster inside an <svg> wrapper.
function outlineCanvas(srcUrl, outlinePx, outlineColor) {
	return new Promise((resolve, reject) => {
		const img = new Image();
		img.crossOrigin = 'anonymous';
		img.onload = () => {
			const w = img.naturalWidth, h = img.naturalHeight, pad = outlinePx + 2;
			const cw = w + pad * 2, ch = h + pad * 2;
			// 1) colored silhouette of the source
			const sil = document.createElement('canvas');
			sil.width = cw; sil.height = ch;
			const sx = sil.getContext('2d');
			sx.drawImage(img, pad, pad, w, h);
			sx.globalCompositeOperation = 'source-in';
			sx.fillStyle = outlineColor;
			sx.fillRect(0, 0, cw, ch);
			// 2) stamp silhouette in a full ring of offsets to dilate -> hard outline
			const out = document.createElement('canvas');
			out.width = cw; out.height = ch;
			const ox = out.getContext('2d');
			for (let a = 0; a < 360; a += 12) {
				ox.drawImage(sil, Math.round(Math.cos(a * Math.PI / 180) * outlinePx),
				                  Math.round(Math.sin(a * Math.PI / 180) * outlinePx));
			}
			// 3) original art on top
			ox.drawImage(img, pad, pad, w, h);
			resolve(out);
		};
		img.onerror = () => reject(new Error('Failed to load ' + srcUrl));
		img.src = srcUrl;
	});
}

// Wrap the outlined raster as an <image> inside an SVG of matching size.
function canvasToSvg(canvas) {
	const png = canvas.toDataURL('image/png');
	return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${canvas.width}" height="${canvas.height}" viewBox="0 0 ${canvas.width} ${canvas.height}">
	<image width="${canvas.width}" height="${canvas.height}" xlink:href="${png}"/>
</svg>`;
}

function download(filename, text) {
	const blob = new Blob([text], { type: 'image/svg+xml' });
	const a = document.createElement('a');
	a.href = URL.createObjectURL(blob);
	a.download = filename;
	document.body.appendChild(a);
	a.click();
	a.remove();
	setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const svgByName = {};

async function build() {
	const grid = document.getElementById('grid');
	for (const bit of BITS) {
		try {
			const canvas = await outlineCanvas(url(bit.name), OUTLINE_PX, bit.outline);
			const svg = canvasToSvg(canvas);
			svgByName[bit.name] = svg;

			const card = document.createElement('div');
			card.className = 'card';
			const dataUri = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
			const link = document.createElement('a');
			link.textContent = 'download';
			link.href = dataUri;
			link.download = `bit-${bit.name}-outline.svg`;
			card.innerHTML = `<img src="${dataUri}"><div class="name">${bit.name}</div>`;
			card.appendChild(link);
			grid.appendChild(card);
		} catch (e) {
			console.error(e);
			const card = document.createElement('div');
			card.className = 'card';
			card.innerHTML = `<div class="name">${bit.name}: failed</div>`;
			grid.appendChild(card);
		}
	}
}

document.getElementById('all').addEventListener('click', () => {
	BITS.forEach((bit, i) => {
		const svg = svgByName[bit.name];
		if (svg) setTimeout(() => download(`bit-${bit.name}-outline.svg`, svg), i * 250);
	});
});

build();
</script>
</body>
</html>
